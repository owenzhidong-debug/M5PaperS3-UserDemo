<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>M5 Paper S3 阅读器交互原型</title>
  <style>
    :root {
      --ink: #1c211d;
      --paper: #f7f8f4;
      --soft: #e9ece6;
      --line: #aeb7ad;
      --muted: #687169;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #e2e6e0;
      color: var(--ink);
      font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }
    button { font: inherit; }
    .workspace {
      width: min(1160px, 100%);
      min-height: 100vh;
      margin: auto;
      padding: 30px;
      display: grid;
      grid-template-columns: 1fr 540px;
      gap: 48px;
      align-items: center;
    }
    .copy h1 { margin: 0 0 12px; font-size: 32px; line-height: 1.15; }
    .copy p { max-width: 450px; margin: 0 0 22px; color: #384138; line-height: 1.65; }
    .legend { display: grid; gap: 11px; max-width: 460px; color: #4d564e; font-size: 14px; line-height: 1.45; }
    .legend b { color: var(--ink); }
    .device {
      position: relative;
      width: 540px;
      height: 960px;
      overflow: hidden;
      border: 10px solid #d5dad4;
      border-radius: 18px;
      background: var(--paper);
      box-shadow: 0 20px 45px #6d756b55, inset 0 0 0 2px #9fa79e;
      user-select: none;
      touch-action: manipulation;
    }
    .screen, .view { position: absolute; inset: 0; }
    .screen { background: var(--paper); }
    .hidden { display: none !important; }
    .home { display: grid; place-items: center; }
    .open-book {
      width: 300px;
      height: 100px;
      border: 2px solid var(--ink);
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      font-size: 28px;
      font-weight: 700;
      cursor: pointer;
    }
    .reader { padding: 42px 34px 48px; }
    .book-name, .status { position: absolute; top: 16px; font-size: 12px; color: var(--muted); }
    .book-name { left: 34px; font-weight: 700; }
    .status { right: 34px; }
    .page {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 27px;
      line-height: 1.32;
      white-space: pre-line;
    }
    .page.font-sans { font-family: Arial, sans-serif; }
    .page.font-serif { font-family: Georgia, "Times New Roman", serif; }
    .page.font-mono { font-family: "Courier New", monospace; }
    .page.font-bold { font-family: Arial, sans-serif; font-weight: 700; }
    .page.size-small { font-size: 22px; }
    .page.size-medium { font-size: 27px; }
    .page.size-large { font-size: 32px; }
    .hot-zones {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      grid-template-columns: 30% 40% 30%;
    }
    .hot-zone { border: 0; background: transparent; cursor: pointer; }
    .progress {
      position: absolute;
      z-index: 4;
      left: 28px;
      right: 28px;
      bottom: 28px;
      height: 8px;
      border: 1px solid var(--ink);
      background: var(--paper);
      cursor: pointer;
    }
    .progress::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: -32px;
      bottom: -32px;
    }
    .progress i { display: block; height: 100%; background: var(--ink); width: 33.33%; }
    .controls { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
    .round {
      position: absolute;
      width: 84px;
      height: 84px;
      border: 2px solid var(--ink);
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--paper);
      color: var(--ink);
      pointer-events: auto;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
    }
    .round:hover, .round:focus-visible { background: var(--soft); outline: 0; }
    .close { left: 16px; top: 16px; }
    .bookmark { left: var(--bookmark-x); top: var(--bookmark-y); }
    .layout { left: var(--layout-x); top: var(--layout-y); }
    .toc { left: var(--toc-x); top: var(--toc-y); }
    .settings { left: var(--settings-x); top: var(--settings-y); }
    .x-icon { position: relative; width: 30px; height: 30px; }
    .x-icon::before, .x-icon::after {
      content: "";
      position: absolute;
      left: 14px;
      top: -5px;
      width: 2px;
      height: 40px;
      background: var(--ink);
      transform: rotate(45deg);
    }
    .x-icon::after { transform: rotate(-45deg); }
    .bookmark-icon { position: relative; width: 25px; height: 36px; border: 2px solid var(--ink); }
    .bookmark-icon::after {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      left: 5px;
      bottom: -7px;
      transform: rotate(45deg);
      background: var(--paper);
      border-left: 2px solid var(--ink);
      border-top: 2px solid var(--ink);
    }
    .toc-icon { display: grid; gap: 7px; width: 35px; }
    .toc-icon i { display: block; height: 2px; background: var(--ink); }
    .gear {
      position: relative;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--ink);
    }
    .gear::before {
      content: "";
      position: absolute;
      inset: 13px;
      border-radius: 50%;
      background: var(--paper);
    }
    .gear::after {
      content: "";
      position: absolute;
      left: 15px;
      top: -7px;
      width: 8px;
      height: 52px;
      background: var(--ink);
      box-shadow: -15px 15px 0 -1px var(--ink), 15px 15px 0 -1px var(--ink);
    }
    .panel {
      position: absolute;
      z-index: 10;
      left: 28px;
      width: calc(100% - 56px);
      border: 2px solid var(--ink);
      background: var(--paper);
      padding: 0 24px 18px;
    }
    .panel.full { left: 0; width: 100%; }
    .panel-back-row {
      height: 56px;
      display: flex;
      align-items: center;
      gap: 16px;
      border: 0;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      width: 100%;
      padding: 0;
      text-align: left;
    }
    .panel-back { font-size: 34px; line-height: 1; }
    .panel-title { font-size: 18px; font-weight: 700; }
    .panel-body { margin-top: 0; }
    .layout-row {
      height: 62px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      border-bottom: 1px solid var(--line);
      font-size: 16px;
    }
    .row-action {
      min-width: 150px;
      height: 42px;
      border: 1px solid var(--ink);
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font-size: 14px;
    }
    .adjust-group {
      display: grid;
      grid-template-columns: 42px 54px 42px;
      align-items: center;
      gap: 6px;
    }
    .adjust {
      width: 42px;
      height: 42px;
      border: 1px solid var(--ink);
      background: transparent;
      color: var(--ink);
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
    }
    .value {
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid var(--ink);
      font-size: 16px;
    }
    .switch-row {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      font-size: 15px;
    }
    .switch {
      width: 88px;
      height: 36px;
      border: 1px solid var(--ink);
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      font-size: 13px;
    }
    .switch span { height: 100%; display: grid; place-items: center; }
    .switch.on span:first-child, .switch:not(.on) span:last-child {
      background: var(--ink);
      color: var(--paper);
    }
    .choice-button {
      min-width: 126px;
      height: 40px;
      border: 1px solid var(--ink);
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font-size: 13px;
    }
    .toc-head {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      font-weight: 700;
    }
    .chapter {
      width: 100%;
      height: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      font-size: 15px;
      text-align: left;
      cursor: pointer;
    }
    .chapter span:last-child { color: var(--muted); }
    .jump-input {
      width: 100%;
      height: 60px;
      border: 1px solid var(--ink);
      background: transparent;
      text-align: left;
      padding: 0 18px;
      color: var(--ink);
      font-size: 24px;
    }
    .range { margin: 12px 0 10px; text-align: right; color: var(--muted); font-size: 14px; }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .key {
      height: 58px;
      border: 1px solid var(--ink);
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font-size: 17px;
    }
    .key.go { background: var(--ink); color: var(--paper); }
    .toast {
      position: absolute;
      z-index: 20;
      left: 50%;
      bottom: 72px;
      transform: translateX(-50%);
      min-width: 190px;
      height: 52px;
      padding: 0 20px;
      display: grid;
      place-items: center;
      border: 2px solid var(--ink);
      background: var(--paper);
      font-size: 16px;
    }
    .flash {
      position: absolute;
      z-index: 30;
      inset: 0;
      pointer-events: none;
      background: #fff;
      opacity: 0;
    }
    .flash.run { animation: flash .45s ease-out; }
    @keyframes flash { from { opacity: 1; } to { opacity: 0; } }
    @media (max-width: 900px) {
      .workspace { grid-template-columns: 1fr; justify-items: center; gap: 20px; }
      .copy { max-width: 540px; text-align: center; }
      .legend { margin: auto; text-align: left; }
    }
    @media (max-width: 570px) {
      .workspace { padding: 0; }
      .copy { padding: 20px 20px 0; }
      .copy h1 { font-size: 26px; }
      .device {
        width: 100vw;
        height: calc(100vw * 1.77778);
        max-height: 960px;
        border-width: 6px;
        border-radius: 0;
      }
      .screen { width: 540px; height: 960px; transform: scale(calc(100vw / 540)); transform-origin: top left; }
    }
  </style>
</head>
<body>
  <main class="workspace">
    <section class="copy">
      <h1>M5 Paper S3 阅读器</h1>
      <p>此交互原型同步当前设备内已烧录的阅读固件：首页只保留“打开 txt”，进入后为竖屏阅读。</p>
      <div class="legend">
        <div><b>左侧 / 中间 / 右侧：</b>上一页、唤起操作、下一页。中间热区约占屏幕宽度 40%。</div>
        <div><b>主操作：</b>关闭固定在左上角；书签、排版、目录、设置跟随点击位置，以 2x2 方阵显示。</div>
        <div><b>菜单面板：</b>排版、目录、设置、页码跳转都会跟随对应操作位置显示，并自动限制在屏幕内。</div>
        <div><b>进度条：</b>唤起操作时底部显示，点击后可输入页码跳转。</div>
        <div><b>双击或长按 2 秒：</b>模拟全屏强制刷新；隐藏菜单也会触发一次刷新。</div>
      </div>
    </section>
    <section class="device" id="device" aria-label="M5 Paper S3 阅读器原型">
      <div class="screen">
        <section class="view home" id="homeView">
          <button class="open-book" id="openBook">打开 txt</button>
        </section>
        <section class="view reader hidden" id="readerView">
          <span class="book-name">BOOK.TXT</span>
          <span class="status" id="pageStatus">1 / 3</span>
          <article class="page" id="pageText"></article>
          <div class="hot-zones" id="hotZones">
            <button class="hot-zone" data-zone="previous" aria-label="上一页"></button>
            <button class="hot-zone" data-zone="controls" aria-label="操作菜单"></button>
            <button class="hot-zone" data-zone="next" aria-label="下一页"></button>
          </div>
          <button class="progress hidden" id="progress" aria-label="阅读进度"><i id="progressFill"></i></button>
          <div class="controls main-controls hidden" id="mainControls">
            <button class="round close" data-action="close" aria-label="关闭"><span class="x-icon"></span></button>
            <button class="round bookmark" data-action="bookmark" aria-label="书签"><span class="bookmark-icon"></span></button>
            <button class="round layout" data-action="layout" aria-label="排版">Aa</button>
            <button class="round toc" data-action="toc" aria-label="目录"><span class="toc-icon"><i></i><i></i><i></i></span></button>
            <button class="round settings" data-action="settings" aria-label="设置"><span class="gear"></span></button>
          </div>
          <section class="panel hidden" id="layoutPanel" data-anchor="layout" data-height="450">
            <button class="panel-back-row" data-back="main" aria-label="返回"><span class="panel-back">‹</span><strong class="panel-title">排版</strong></button>
            <div class="panel-body" id="layoutRows"></div>
          </section>
          <section class="panel full hidden" id="settingsPanel" data-anchor="settings" data-height="448">
            <button class="panel-back-row" data-back="main" aria-label="返回"><span class="panel-back">‹</span><strong class="panel-title">设置</strong></button>
            <div class="panel-body" id="settingsRows"></div>
          </section>
          <section class="panel full hidden" id="tocPanel" data-anchor="toc" data-height="480">
            <div class="toc-head"><span>Contents</span><span id="tocPageCount">1/3</span></div>
            <div id="tocRows"></div>
          </section>
          <section class="panel hidden" id="jumpPanel" data-anchor="progress" data-height="540">
            <button class="panel-back-row" data-back="main" aria-label="返回"><span class="panel-back">‹</span><strong class="panel-title">Go to page</strong></button>
            <div class="panel-body">
              <input class="jump-input" id="jumpInput" inputmode="numeric" readonly value="_">
              <div class="range" id="pageRange">1 - 3</div>
              <div class="keypad" id="keypad"></div>
            </div>
          </section>
        </section>
        <div class="toast hidden" id="toast"></div>
        <div class="flash" id="flash"></div>
      </div>
    </section>
  </main>
  <script>
    const pages = [
      "The Lighthouse Keeper's Secret\nThe wind howled like a wounded beast as Eleanor stumbled up the weathered stone path to the lighthouse. Salt stung her cheeks, and the hem of her wool coat dragged through mud and seaweed. She had fled the city three days prior, leaving behind a broken engagement, a suffocating job, and the ghost of a life that no longer fit.",
      'Inside, the old room smelled of dust and iron. A narrow shelf held a notebook, a matchbox, and a folded chart of the coast. Eleanor opened the notebook and found a single sentence written again and again: keep the light on until morning.',
      'By dawn, the storm had moved east. The sea below turned silver, and a fishing boat appeared beyond the rocks. Eleanor closed the notebook, marked the page, and understood why the lighthouse had waited for her.'
    ];
    const fontOptions = ['Sans', 'Serif', 'Mono', 'Bold Sans'];
    const fontClasses = ['font-sans', 'font-serif', 'font-mono', 'font-bold'];
    const fontSizeOptions = ['Small', 'Medium', 'Large'];
    const sizeClasses = ['size-small', 'size-medium', 'size-large'];
    const chapters = ['Chapter 1  Opening', 'Chapter 2  First Turn', 'Chapter 3  Deep Reading', 'Chapter 4  Middle Notes', 'Chapter 5  Later Pages', 'Chapter 6  Ending'];
    const autoOptions = ['5page/min', '10page/min', '15page/min'];
    const alignOptions = ['左对齐', '居中对齐', '右对齐', '两边对齐'];
    const panelIds = ['layoutPanel', 'settingsPanel', 'tocPanel', 'jumpPanel'];
    const el = id => document.getElementById(id);
    const state = {
      page: 0,
      controls: 'hidden',
      font: 1,
      fontSize: 1,
      layout: { line: 3, paragraph: 3, margin: 3, letter: 3 },
      settings: { antialias: false, meta: false, indent: false, underline: false },
      align: 0,
      auto: 0,
      centerX: 270,
      centerY: 480
    };
    let toastTimer;
    let holdTimer;

    function setPage() {
      const page = el('pageText');
      page.textContent = pages[state.page];
      page.className = `page ${fontClasses[state.font]} ${sizeClasses[state.fontSize]}`;
      page.style.lineHeight = 1.12 + state.layout.line * 0.08;
      page.style.marginLeft = `${(state.layout.margin - 3) * 6}px`;
      page.style.marginRight = `${(state.layout.margin - 3) * 6}px`;
      page.style.letterSpacing = `${(state.layout.letter - 3) * 0.8}px`;
      el('pageStatus').textContent = `${state.page + 1} / ${pages.length}`;
      el('tocPageCount').textContent = `${state.page + 1}/${pages.length}`;
      el('pageRange').textContent = `1 - ${pages.length}`;
      el('progressFill').style.width = `${((state.page + 1) / pages.length) * 100}%`;
    }

    function placeControls(x, y) {
      const radius = 42;
      const margin = 92;
      state.centerX = Math.max(margin, Math.min(540 - margin, x));
      state.centerY = Math.max(margin, Math.min(960 - margin, y));
      const positions = {
        bookmark: [-49, -49],
        layout: [49, -49],
        toc: [-49, 49],
        settings: [49, 49]
      };
      Object.entries(positions).forEach(([name, offset]) => {
        el('mainControls').style.setProperty(`--${name}-x`, `${Math.round(state.centerX + offset[0] - radius)}px`);
        el('mainControls').style.setProperty(`--${name}-y`, `${Math.round(state.centerY + offset[1] - radius)}px`);
      });
    }

    function buttonCenter(anchor) {
      if (anchor === 'layout') return [state.centerX + 49, state.centerY - 49];
      if (anchor === 'toc') return [state.centerX - 49, state.centerY + 49];
      if (anchor === 'settings') return [state.centerX + 49, state.centerY + 49];
      return [270, 928];
    }

    function positionPanel(id) {
      const panel = el(id);
      const height = Number(panel.dataset.height);
      const anchor = panel.dataset.anchor;
      const center = buttonCenter(anchor);
      const top = Math.max(0, Math.min(960 - height, Math.round(center[1] - height / 2)));
      panel.style.top = `${top}px`;
      panel.style.height = `${height}px`;
    }

    function hidePanels() {
      panelIds.forEach(id => el(id).classList.add('hidden'));
    }

    function hideAll(refreshScreen = false) {
      el('mainControls').classList.add('hidden');
      el('progress').classList.add('hidden');
      hidePanels();
      state.controls = 'hidden';
      if (refreshScreen) refresh();
    }

    function showMain() {
      hidePanels();
      el('mainControls').classList.remove('hidden');
      el('progress').classList.remove('hidden');
      state.controls = 'main';
    }

    function showPanel(id) {
      el('mainControls').classList.add('hidden');
      el('progress').classList.add('hidden');
      hidePanels();
      positionPanel(id);
      el(id).classList.remove('hidden');
      state.controls = id;
    }

    function toast(text) {
      el('toast').textContent = text;
      el('toast').classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el('toast').classList.add('hidden'), 1400);
    }

    function refresh() {
      const node = el('flash');
      node.classList.remove('run');
      void node.offsetWidth;
      node.classList.add('run');
    }

    function returnHome() {
      hideAll(false);
      el('readerView').classList.add('hidden');
      el('homeView').classList.remove('hidden');
      refresh();
    }

    function renderLayout() {
      const rows = [
        ['字体', fontOptions[state.font], 'font'],
        ['字号', fontSizeOptions[state.fontSize], 'size'],
        ['行间距', state.layout.line, 'line'],
        ['段间距', state.layout.paragraph, 'paragraph'],
        ['页边距', state.layout.margin, 'margin'],
        ['字间距', state.layout.letter, 'letter']
      ];
      el('layoutRows').innerHTML = rows.map(([label, value, key]) => {
        if (key === 'font' || key === 'size') {
          return `<div class="layout-row"><span>${label}</span><button class="row-action" data-cycle="${key}">${value} ›</button></div>`;
        }
        return `<div class="layout-row"><span>${label}</span><span class="adjust-group"><button class="adjust" data-adjust="${key}" data-delta="-1">−</button><span class="value">${value}</span><button class="adjust" data-adjust="${key}" data-delta="1">+</button></span></div>`;
      }).join('');
    }

    function renderSettings() {
      const toggles = [
        ['文字抗锯齿', 'antialias'],
        ['显示章节标题和页数', 'meta'],
        ['首行缩进', 'indent'],
        ['下划线', 'underline']
      ];
      el('settingsRows').innerHTML = toggles.map(([label, key]) => {
        const on = state.settings[key];
        return `<div class="switch-row"><span>${label}</span><button class="switch ${on ? 'on' : ''}" data-setting="${key}"><span>开</span><span>关</span></button></div>`;
      }).join('') +
      `<div class="switch-row"><span>对齐方式</span><button class="choice-button" data-align="1">${alignOptions[state.align]}</button></div>` +
      `<div class="switch-row"><span>自动翻页</span><button class="choice-button" data-auto="1">${autoOptions[state.auto]}</button></div>`;
    }

    function renderToc() {
      el('tocRows').innerHTML = chapters.map((name, index) => {
        const page = Math.min(pages.length - 1, Math.floor(index / 2));
        return `<button class="chapter" data-page="${page}"><span>${name}</span><span>p.${page + 1}</span></button>`;
      }).join('');
    }

    function renderKeypad() {
      const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'Clear', '0', 'Go'];
      el('keypad').innerHTML = keys.map(key => `<button class="key ${key === 'Go' ? 'go' : ''}" data-key="${key}">${key}</button>`).join('');
    }

    el('openBook').addEventListener('click', () => {
      setPage();
      el('homeView').classList.add('hidden');
      el('readerView').classList.remove('hidden');
    });

    el('hotZones').addEventListener('click', event => {
      const zone = event.target.dataset.zone;
      if (!zone) return;
      if (state.controls !== 'hidden') {
        hideAll(true);
        return;
      }
      if (zone === 'controls') {
        const rect = el('readerView').getBoundingClientRect();
        placeControls((event.clientX - rect.left) * 540 / rect.width, (event.clientY - rect.top) * 960 / rect.height);
        showMain();
        return;
      }
      if (zone === 'previous') {
        if (state.page === 0) toast('first page');
        else { state.page -= 1; setPage(); }
      }
      if (zone === 'next') {
        if (state.page + 1 >= pages.length) toast('last page');
        else { state.page += 1; setPage(); }
      }
    });

    el('mainControls').addEventListener('click', event => {
      const action = event.target.closest('button')?.dataset.action;
      if (action === 'close') returnHome();
      if (action === 'bookmark') toast('添加书签成功');
      if (action === 'layout') { renderLayout(); showPanel('layoutPanel'); }
      if (action === 'toc') { renderToc(); showPanel('tocPanel'); }
      if (action === 'settings') { renderSettings(); showPanel('settingsPanel'); }
    });

    el('layoutPanel').addEventListener('click', event => {
      const cycle = event.target.closest('[data-cycle]')?.dataset.cycle;
      const adjust = event.target.closest('[data-adjust]');
      if (cycle === 'font') state.font = (state.font + 1) % fontOptions.length;
      if (cycle === 'size') state.fontSize = (state.fontSize + 1) % fontSizeOptions.length;
      if (adjust) {
        const key = adjust.dataset.adjust;
        state.layout[key] = Math.max(1, Math.min(5, state.layout[key] + Number(adjust.dataset.delta)));
      }
      if (cycle || adjust) {
        setPage();
        renderLayout();
      }
    });

    el('settingsPanel').addEventListener('click', event => {
      const setting = event.target.closest('[data-setting]')?.dataset.setting;
      if (setting) {
        state.settings[setting] = !state.settings[setting];
        renderSettings();
        toast('功能未实现');
      }
      if (event.target.closest('[data-align]')) {
        state.align = (state.align + 1) % alignOptions.length;
        renderSettings();
        toast('功能未实现');
      }
      if (event.target.closest('[data-auto]')) {
        state.auto = (state.auto + 1) % autoOptions.length;
        renderSettings();
      }
    });

    el('tocPanel').addEventListener('click', event => {
      const page = event.target.closest('[data-page]')?.dataset.page;
      if (page !== undefined) {
        state.page = Number(page);
        setPage();
        hideAll(true);
      }
    });

    el('progress').addEventListener('click', event => {
      event.stopPropagation();
      el('jumpInput').value = '_';
      renderKeypad();
      showPanel('jumpPanel');
    });

    el('keypad').addEventListener('click', event => {
      const key = event.target.closest('[data-key]')?.dataset.key;
      const input = el('jumpInput');
      if (!key) return;
      if (key === 'Clear') input.value = '_';
      else if (key === 'Go') {
        const number = Number(input.value.replace('_', ''));
        if (number >= 1 && number <= pages.length) {
          state.page = number - 1;
          setPage();
          hideAll(true);
        } else {
          toast('invalid page');
        }
      } else {
        input.value = input.value === '_' ? key : `${input.value}${key}`.slice(0, 6);
      }
    });

    document.querySelectorAll('[data-back]').forEach(button => {
      button.addEventListener('click', () => showMain());
    });

    el('readerView').addEventListener('dblclick', refresh);
    el('device').addEventListener('pointerdown', () => { holdTimer = setTimeout(refresh, 2000); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(type => {
      el('device').addEventListener(type, () => clearTimeout(holdTimer));
    });

    placeControls(state.centerX, state.centerY);
    setPage();
  </script>
</body>
</html>
